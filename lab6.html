<!DOCTYPE html>
<html>
<head>
    <title>CSE Marks Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding: 30px;
        }

        .container {
            background: white;
            width: 350px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px;
        }

        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>CSE Marks Calculator</h2>

    <input type="number" id="sub1" placeholder="Enter DMGT Marks">
    <input type="number" id="sub2" placeholder="Enter DSA Marks">
    <input type="number" id="sub3" placeholder="Enter CAO Marks">
    <input type="number" id="sub4" placeholder="Enter MDM-WD Marks">
    <input type="number" id="sub5" placeholder="Enter ED Marks">

    <br><br>
    <button onclick="calculateGrade()">Calculate Result</button>

    <div id="result"></div>
</div>

<script>
function calculateGrade() {

    let m1 = Number(document.getElementById("sub1").value);
    let m2 = Number(document.getElementById("sub2").value);
    let m3 = Number(document.getElementById("sub3").value);
    let m4 = Number(document.getElementById("sub4").value);
    let m5 = Number(document.getElementById("sub5").value);

    let total = m1 + m2 + m3 + m4 + m5;
    let percentage = total / 5;
    let grade;

    if (percentage >= 90) {
        grade = "A+";
    } else if (percentage >= 80) {
        grade = "A";
    } else if (percentage >= 70) {
        grade = "B";
    } else if (percentage >= 60) {
        grade = "C";
    } else if (percentage >= 50) {
        grade = "D";
    } else {
        grade = "F";
    }

    document.getElementById("result").innerHTML =
        "<b>Total Marks:</b> " + total + "/500<br>" +
        "<b>Percentage:</b> " + percentage.toFixed(2) + "%<br>" +
        "<b>Grade:</b> " + grade;
}
</script>

</body>
</html>
